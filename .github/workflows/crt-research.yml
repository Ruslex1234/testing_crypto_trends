name: crt-research

# Manual: backtests CRT on NQ futures and BTC, writes docs/crt/results.{md,json}
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: crt-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Backtest
        run: python3 research/crt_research.py
      - name: Commit results
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/crt/results.md docs/crt/results.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "CRT research results $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
