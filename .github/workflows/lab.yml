name: strategy-lab

# Weekly (and on demand): extend the long hourly history (data/history, since 2019), replay every
# strategy through the live engine, and run the robustness grid. Results feed docs/lab/.
on:
  schedule:
    - cron: "47 3 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: strategy-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m pip install --quiet --disable-pip-version-check scikit-learn numpy
      - name: Update long history
        run: python3 research/history.py
      - name: Replay all strategies
        run: python3 research/lab.py
      - name: Robustness grid
        run: python3 research/lab_robust.py
      - name: Commit
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history docs/lab
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Strategy lab $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
