name: ml-research

# Daily: extends the hourly price cache (data/ml), re-runs the walk-forward AI backtest and
# refreshes docs/ml/live_config.json (the EV threshold the live AI account trades with).
on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ml-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m pip install --quiet --disable-pip-version-check scikit-learn numpy
      - name: Walk-forward backtest
        run: python3 research/ml_research.py
      - name: Quick 1h long/short walk-forward
        run: python3 research/quick_research.py
      - name: Commit
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ml docs/ml docs/quick
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "AI research $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
